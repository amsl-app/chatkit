[package]
name = "chatkit"
version = "0.1.0"
edition = "2024"
description = "Thin async Rust wrapper around any OpenAI-compatible chat API with streaming, tool calling, and structured output support."
license = "MIT OR Apache-2.0"
repository = "https://github.com/amsl-app/chatkit"
authors = ["Sven Scheu", "Linus Bierhoff"]

[features]
metrics = ["dep:metrics"]

[dependencies]
metrics = { version = "0.24", optional = true }
async-openai = { version = "0.40.2", features = [
    "chat-completion",
    "middleware",
] }
async-stream = "0.3.6"
futures = "0.3.32"
futures-retry-policies = "0.3.1"
regex = "1.12.3"
reqwest = "0.13.3"
schemars = "1.2.1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = "1.52.3"
tower = "0.5.3"
tracing = "0.1.44"
typed-builder = "0.23.2"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
dotenvy = "0.15.7"
